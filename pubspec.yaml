name: cse_portfolio_tracker
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  get_it: ^7.6.0
  go_router: ^10.0.0
  fl_chart: ^0.63.0
  google_fonts: ^5.0.0
  intl: ^0.18.0
  cupertino_icons: ^1.0.2
  flutter_launcher_icons: ^0.14.4
  supabase_flutter: ^2.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#0B162C"
