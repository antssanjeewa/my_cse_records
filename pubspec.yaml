name: cse_portfolio_tracker
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  get_it: ^9.2.0
  go_router: ^17.1.0
  fl_chart: ^1.1.1
  google_fonts: ^8.0.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.2
  flutter_launcher_icons: ^0.14.4
  supabase_flutter: ^2.12.0
  local_auth: ^3.0.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^10.0.0
  uuid: ^4.5.2
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#0B162C"
  adaptive_icon_foreground: "assets/images/icon.png"
  adaptive_icon_foreground_inset: 32   # Increased inset to shrink the logo further into the safe zone
  adaptive_icon_background_color: "#0B162C"

flutter_native_splash:
  color: "#0B162C"
  image: "assets/images/splash_icon.png"
  android_12:
    image: "assets/images/splash_icon.png"
    color: "#0B162C"
    icon_background_color: "#0B162C"


