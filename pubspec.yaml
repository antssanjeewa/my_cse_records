name: cse_portfolio_tracker
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  get_it: ^7.6.0
  go_router: ^10.0.0
  fl_chart: ^0.63.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.2
  flutter_launcher_icons: ^0.14.4
  supabase_flutter: ^2.12.0
  local_auth: ^2.2.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  uuid: ^4.5.2
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#0B162C"

flutter_native_splash:
  color: "#0B162C"
  image: "assets/images/icon.png"
  android: true
  ios: false
  android_12:
    color: "#0B162C"
    image: "assets/images/icon.png"

