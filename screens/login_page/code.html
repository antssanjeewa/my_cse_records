<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CSE Portfolio Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1337ec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101322",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-white">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<!-- TopAppBar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between">
<div class="text-primary flex size-12 shrink-0 items-center justify-center cursor-pointer" data-icon="arrow_back_ios">
<span class="material-symbols-outlined">arrow_back_ios</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Login</h2>
</div>
<!-- Branding / Illustration -->
<div class="flex flex-col items-center justify-center pt-8 pb-4">
<div class="w-16 h-16 bg-primary/20 rounded-xl flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary text-4xl">trending_up</span>
</div>
</div>
<!-- HeadlineText -->
<div class="px-4">
<h1 class="text-slate-900 dark:text-white tracking-light text-[32px] font-bold leading-tight text-center pb-2">Welcome Back</h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-normal leading-normal text-center pb-6 px-4">Securely manage your CSE portfolio and track market movements in real-time.</p>
</div>
<!-- Login Form -->
<div class="flex flex-col gap-2">
<!-- Email TextField -->
<div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-2">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-slate-700 dark:text-white text-base font-medium leading-normal pb-2">Email Address</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-200 dark:border-[#323b67] bg-white dark:bg-[#191e33] h-14 placeholder:text-slate-400 dark:placeholder:text-[#929bc9] p-[15px] text-base font-normal leading-normal" placeholder="e.g. investor@cse.lk" type="email" value=""/>
</label>
</div>
<!-- Password TextField -->
<div class="flex max-w-[480px] flex-wrap items-end gap-1 px-4 py-2">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-slate-700 dark:text-white text-base font-medium leading-normal pb-2">Password</p>
<div class="flex w-full flex-1 items-stretch rounded-xl">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-slate-200 dark:border-[#323b67] bg-white dark:bg-[#191e33] h-14 placeholder:text-slate-400 dark:placeholder:text-[#929bc9] p-[15px] rounded-r-none border-r-0 pr-2 text-base font-normal leading-normal" placeholder="Enter your password" type="password" value=""/>
<div class="text-slate-400 dark:text-[#929bc9] flex border border-slate-200 dark:border-[#323b67] bg-white dark:bg-[#191e33] items-center justify-center pr-[15px] rounded-r-xl border-l-0" data-icon="visibility">
<span class="material-symbols-outlined">visibility</span>
</div>
</div>
</label>
</div>
<!-- Forgot Password -->
<div class="flex justify-end px-4 mb-4">
<button class="text-primary text-sm font-semibold">Forgot Password?</button>
</div>
<!-- Sign In Button -->
<div class="px-4 py-2">
<button class="w-full h-14 bg-primary text-white rounded-xl font-bold text-lg flex items-center justify-center shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform">
                    Sign In
                </button>
</div>
</div>
<!-- Biometric Login Section -->
<div class="mt-8 flex flex-col items-center">
<p class="text-slate-500 dark:text-[#929bc9] text-sm mb-4">Quick Access</p>
<button class="size-16 rounded-full border border-primary/30 flex items-center justify-center bg-primary/10 text-primary active:bg-primary/20">
<span class="material-symbols-outlined text-4xl">fingerprint</span>
</button>
<p class="text-slate-400 dark:text-[#929bc9] text-xs mt-2">Biometric Login</p>
</div>
<!-- Social Login -->
<div class="mt-8 px-4">
<div class="flex items-center gap-4 mb-6">
<div class="h-[1px] flex-1 bg-slate-200 dark:bg-[#323b67]"></div>
<p class="text-slate-400 text-xs uppercase tracking-widest">Or continue with</p>
<div class="h-[1px] flex-1 bg-slate-200 dark:bg-[#323b67]"></div>
</div>
<div class="flex justify-center gap-4">
<button class="flex-1 h-12 rounded-xl border border-slate-200 dark:border-[#323b67] flex items-center justify-center gap-2 bg-white dark:bg-[#191e33]">
<span class="material-symbols-outlined text-xl">google</span>
<span class="text-slate-700 dark:text-white text-sm font-medium">Google</span>
</button>
<button class="flex-1 h-12 rounded-xl border border-slate-200 dark:border-[#323b67] flex items-center justify-center gap-2 bg-white dark:bg-[#191e33]">
<span class="material-symbols-outlined text-xl">ios</span>
<span class="text-slate-700 dark:text-white text-sm font-medium">Apple</span>
</button>
</div>
</div>
<!-- Footer / Sign Up -->
<div class="mt-auto pb-10 pt-8 text-center">
<p class="text-slate-500 dark:text-[#929bc9] text-sm">
                Don't have an account? 
                <button class="text-primary font-bold ml-1">Sign Up</button>
</p>
</div>
<!-- Security Badge -->
<div class="flex items-center justify-center gap-1 pb-4 opacity-50">
<span class="material-symbols-outlined text-xs">lock</span>
<span class="text-[10px] uppercase tracking-tighter">End-to-end encrypted</span>
</div>
</div>
</body></html>
